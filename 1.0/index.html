<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minroger 2D - Survival + Animales</title>
<style>
    body {
        margin: 0; overflow: hidden; background: #000;
        font-family: 'Courier New', Courier, monospace; user-select: none;
    }
    canvas { display: block; image-rendering: pixelated; }
    #ui-container {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 5px; background: rgba(0, 0, 0, 0.7);
        padding: 10px; border-radius: 5px; border: 2px solid #555;
    }
    .hotbar-slot {
        width: 48px; height: 48px; border: 2px solid #888;
        background: rgba(100, 100, 100, 0.5); display: flex;
        align-items: center; justify-content: center; position: relative;
    }
    .hotbar-slot.active { border-color: #FFF; box-shadow: 0 0 10px white; background: rgba(200, 200, 200, 0.5); }
    .hotbar-slot img { max-width: 36px; max-height: 36px; }
    .hotbar-number { position: absolute; top: 2px; left: 4px; font-size: 12px; color: white; font-weight: bold; text-shadow: 1px 1px 0 #000; }
    .item-count { position: absolute; bottom: 2px; right: 4px; font-size: 14px; color: white; font-weight: bold; text-shadow: 1px 1px 0 #000; }
    
    #crafting-menu {
        display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9); border: 4px solid #555; padding: 20px;
        color: white; border-radius: 10px; width: 400px; max-height: 80vh; overflow-y: auto;
    }
    #crafting-menu h2 { margin-top: 0; text-align: center; }
    .recipe {
        display: flex; justify-content: space-between; align-items: center;
        background: #333; margin-bottom: 10px; padding: 10px; border-radius: 5px; border: 1px solid #777;
    }
    .recipe-reqs { font-size: 12px; color: #CCC; }
    .craft-btn { background: #4CAF50; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 3px; font-weight: bold; }
    .craft-btn:disabled { background: #555; cursor: not-allowed; }
    .craft-btn:hover:not(:disabled) { background: #45a049; }
    
    #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; }
    #controls {
        position: fixed; top: 10px; right: 10px; color: white;
        background: rgba(0,0,0,0.5); padding: 10px; font-size: 12px; border-radius: 5px; text-align: right; pointer-events: none;
    }
</style>
</head>
<body>

<div id="loading">Cargando Minroger Survival...</div>
<canvas id="game"></canvas>

<div id="ui-container"></div>

<div id="crafting-menu">
    <h2>Fabricación</h2>
    <div id="recipes-container"></div>
    <p style="text-align:center; font-size:12px; color:#aaa;">Pulsa 'E' para cerrar</p>
</div>

<div id="controls">
    <b>Controles:</b><br>
    A/D: Mover | Espacio: Saltar<br>
    <b>Mantener</b> Click Izq: Minar<br>
    Click Izq (Entidad): Atacar<br>
    Click Der: Poner Bloque<br>
    <b>E: Crafteo</b> | 1-9: Inventario<br>
    G: Guardar | C: Cargar
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

const TILE = 48;
const WORLD_WIDTH = 200;
const WORLD_HEIGHT = 60;

const imageSrcs = {
    jugador: 'assets/jugador.png',
    picomadera: 'assets/picomadera.png',
    picopiedra: 'assets/picopiedra.png',
    espadamadera: 'assets/espadamadera.png',
    bloquepiedra: 'assets/bloquepiedra.jpg',
    palomadera: 'assets/palomadera.png',
    bloquetablon: 'assets/bloquetablon.jpg',
    bloquemadera: 'assets/bloquemadera.jpg',
    cielo: 'assets/cielo.png',
    hoja: 'assets/hoja.png',
    bloquepasto: 'assets/bloquepasto.png',
    bloquetierra: 'assets/bloquetierra.png',
    cerdo: 'assets/cerdo.png', // NUEVO ASSET
    pollo: 'assets/pollo.png'  // NUEVO ASSET
};

const images = {};
let imagesLoaded = 0;
const totalImages = Object.keys(imageSrcs).length;

const items = {
    0: { name: "Aire", key: null, isBlock: false },
    1: { name: "Pasto", key: 'bloquepasto', isBlock: true },
    2: { name: "Tierra", key: 'bloquetierra', isBlock: true },
    3: { name: "Piedra", key: 'bloquepiedra', isBlock: true },
    4: { name: "Madera", key: 'bloquemadera', isBlock: true },
    5: { name: "Hojas", key: 'hoja', isBlock: true },
    6: { name: "Tablón", key: 'bloquetablon', isBlock: true },
    7: { name: "Pico Madera", key: 'picomadera', isBlock: false, maxStack: 1 },
    8: { name: "Pico Piedra", key: 'picopiedra', isBlock: false, maxStack: 1 },
    9: { name: "Palo", key: 'palomadera', isBlock: false },
    10: { name: "Espada Madera", key: 'espadamadera', isBlock: false, maxStack: 1 }
};

let inventory = Array.from({length: 9}, () => ({ id: 0, count: 0 }));
let selectedSlot = 0; 
let isCraftingOpen = false;
let world = [];
let entities = []; // ALMACENARÁ ANIMALES

const recipes = [
    { result: { id: 6, count: 4 }, reqs: [{ id: 4, count: 1 }] },
    { result: { id: 9, count: 4 }, reqs: [{ id: 6, count: 2 }] },
    { result: { id: 7, count: 1 }, reqs: [{ id: 6, count: 3 }, { id: 9, count: 2 }] },
    { result: { id: 8, count: 1 }, reqs: [{ id: 3, count: 3 }, { id: 9, count: 2 }] },
    { result: { id: 10, count: 1 }, reqs: [{ id: 6, count: 2 }, { id: 9, count: 1 }] }
];

for (let key in imageSrcs) {
    images[key] = new Image();
    images[key].src = imageSrcs[key];
    images[key].onload = () => {
        imagesLoaded++;
        if (imagesLoaded === totalImages) {
            document.getElementById("loading").style.display = "none";
            initGame();
        }
    };
    images[key].onerror = () => alert(`Falta el asset: ${imageSrcs[key]}`);
}

function generateWorld() {
    let terrainHeight = 30;
    for (let y = 0; y < WORLD_HEIGHT; y++) {
        world[y] = [];
        for (let x = 0; x < WORLD_WIDTH; x++) {
            if (y > terrainHeight + 3) world[y][x] = 3;
            else if (y > terrainHeight) world[y][x] = 2;
            else if (y === terrainHeight) world[y][x] = 1;
            else world[y][x] = 0;
        }
    }
    
    entities = []; // Reiniciar entidades

    for (let x = 5; x < WORLD_WIDTH - 5; x++) {
        // Árboles
        if (Math.random() < 0.1) {
            let y = terrainHeight - 1;
            world[y][x] = 4; world[y-1][x] = 4; world[y-2][x] = 4;
            world[y-3][x] = 5; world[y-4][x] = 5; world[y-3][x-1] = 5; world[y-3][x+1] = 5; world[y-2][x-1] = 5; world[y-2][x+1] = 5;
            x += 2;
        }
        // Generar Animales en el pasto
        else if (Math.random() < 0.08) {
            let type = Math.random() < 0.5 ? 'cerdo' : 'pollo';
            entities.push({
                type: type,
                x: x * TILE,
                y: (terrainHeight - 2) * TILE,
                width: type === 'cerdo' ? 44 : 24,
                height: type === 'cerdo' ? 32 : 24,
                dx: 0, dy: 0,
                speed: type === 'cerdo' ? 1 : 0.6,
                facingLeft: Math.random() < 0.5,
                stateTimer: Math.random() * 100,
                action: 0 // 0: quieto, 1: izq, 2: der
            });
        }
    }
}

let player = { x: 100, y: 100, width: 36, height: 72, dx: 0, dy: 0, speed: 6, jump: -12, grounded: false, facingLeft: false };
const gravity = 0.6;
let camera = { x: 0, y: 0 };
let keys = {};

let mouse = { x: 0, y: 0, isDown: false };
let mining = { active: false, x: -1, y: -1, progress: 0, required: 0 };

function getCollisions(x, y, w, h) {
    let tiles = [];
    let left = Math.floor(x / TILE), right = Math.floor((x + w - 1) / TILE);
    let top = Math.floor(y / TILE), bottom = Math.floor((y + h - 1) / TILE);
    for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {
            if (ty >= 0 && ty < WORLD_HEIGHT && tx >= 0 && tx < WORLD_WIDTH && world[ty][tx] !== 0) {
                tiles.push({x: tx, y: ty});
            }
        }
    }
    return tiles;
}

function updatePlayer() {
    if(isCraftingOpen) return;

    player.dx = 0;
    if (keys["a"] || keys["arrowleft"]) { player.dx = -player.speed; player.facingLeft = true; }
    if (keys["d"] || keys["arrowright"]) { player.dx = player.speed; player.facingLeft = false; }
    if ((keys[" "] || keys["w"] || keys["arrowup"]) && player.grounded) { player.dy = player.jump; player.grounded = false; }

    player.dy += gravity;
    if(player.dy > 18) player.dy = 18;

    // Colisión X
    player.x += player.dx;
    let colX = getCollisions(player.x, player.y, player.width, player.height);
    if (colX.length > 0) {
        if (player.dx > 0) player.x = colX[0].x * TILE - player.width;
        else if (player.dx < 0) player.x = (colX[0].x + 1) * TILE;
    }

    // Colisión Y
    player.y += player.dy;
    player.grounded = false;
    let colY = getCollisions(player.x, player.y, player.width, player.height);
    if (colY.length > 0) {
        if (player.dy > 0) { player.y = colY[0].y * TILE - player.height; player.dy = 0; player.grounded = true; } 
        else if (player.dy < 0) { player.y = (colY[0].y + 1) * TILE; player.dy = 0; }
    }
    
    if (player.x < 0) player.x = 0;
    if (player.x > WORLD_WIDTH * TILE - player.width) player.x = WORLD_WIDTH * TILE - player.width;
}

// IA DE LOS ANIMALES
function updateEntities() {
    for (let i = entities.length - 1; i >= 0; i--) {
        let e = entities[i];
        
        // Temporizador de estado (Caminar/Parar)
        e.stateTimer--;
        if (e.stateTimer <= 0) {
            e.action = Math.floor(Math.random() * 3); // 0, 1 o 2
            e.stateTimer = 60 + Math.random() * 120; // 1 a 3 segundos
            // Saltitos aleatorios
            if (e.action > 0 && Math.random() < 0.2) e.dy = -8;
        }

        e.dx = 0;
        if (e.action === 1) { e.dx = -e.speed; e.facingLeft = true; }
        if (e.action === 2) { e.dx = e.speed; e.facingLeft = false; }

        e.dy += gravity;
        if(e.dy > 18) e.dy = 18;

        // Movimiento Animal X
        e.x += e.dx;
        let colX = getCollisions(e.x, e.y, e.width, e.height);
        if (colX.length > 0) {
            if (e.dx > 0) e.x = colX[0].x * TILE - e.width;
            else if (e.dx < 0) e.x = (colX[0].x + 1) * TILE;
            // Si choca pared, intenta saltar
            e.dy = -6; 
            e.action = e.action === 1 ? 2 : 1; // Se da la vuelta
        }

        // Movimiento Animal Y
        e.y += e.dy;
        let grounded = false;
        let colY = getCollisions(e.x, e.y, e.width, e.height);
        if (colY.length > 0) {
            if (e.dy > 0) { e.y = colY[0].y * TILE - e.height; e.dy = 0; grounded = true; }
            else if (e.dy < 0) { e.y = (colY[0].y + 1) * TILE; e.dy = 0; }
        }

        // Eliminar si cae al vacío
        if (e.y > WORLD_HEIGHT * TILE) entities.splice(i, 1);
    }
}

function updateCamera() {
    camera.x += (player.x - canvas.width / 2 + player.width / 2 - camera.x) * 0.1;
    camera.y += (player.y - canvas.height / 2 + player.height / 2 - camera.y) * 0.1;
    if(camera.x < 0) camera.x = 0;
    if(camera.x > WORLD_WIDTH * TILE - canvas.width) camera.x = WORLD_WIDTH * TILE - canvas.width;
    if(camera.y > WORLD_HEIGHT * TILE - canvas.height) camera.y = WORLD_HEIGHT * TILE - canvas.height;
}

function getMineFrames(blockId, toolId) {
    let baseTime = 60; 
    if (blockId === 1 || blockId === 2) baseTime = 30;
    else if (blockId === 4 || blockId === 6) baseTime = 90;
    else if (blockId === 5) baseTime = 15;
    else if (blockId === 3) baseTime = 240;

    if (toolId === 7 && blockId === 3) baseTime = 90;
    else if (toolId === 8 && blockId === 3) baseTime = 45;
    else if (toolId === 10 && blockId === 5) baseTime = 5;

    return baseTime;
}

function updateMining() {
    if (!mouse.isDown || isCraftingOpen) {
        mining.active = false;
        mining.progress = 0;
        return;
    }

    let worldX = Math.floor((mouse.x + camera.x) / TILE);
    let worldY = Math.floor((mouse.y + camera.y) / TILE);
    let dist = Math.sqrt(Math.pow(worldX*TILE - player.x, 2) + Math.pow(worldY*TILE - player.y, 2));

    if (worldY >= 0 && worldY < WORLD_HEIGHT && worldX >= 0 && worldX < WORLD_WIDTH && dist < 250) {
        let block = world[worldY][worldX];
        if (block !== 0) {
            let heldItem = inventory[selectedSlot].id;
            if (mining.x !== worldX || mining.y !== worldY) {
                mining.x = worldX; mining.y = worldY; mining.progress = 0;
                mining.required = getMineFrames(block, heldItem); mining.active = true;
            } else {
                mining.progress++;
                if (mining.progress >= mining.required) {
                    let drop = 0;
                    if (block === 1) drop = 2; else if (block === 2) drop = 2;
                    else if (block === 4) drop = 4; else if (block === 5) drop = 0;
                    else if (block === 3) { if (heldItem === 7 || heldItem === 8) drop = 3; } 
                    else drop = block;

                    if (drop !== 0) addItem(drop, 1);
                    world[worldY][worldX] = 0;
                    mining.active = false; mining.progress = 0;
                }
            }
        } else mining.active = false;
    } else mining.active = false;
}

function addItem(id, count) {
    let maxStack = items[id].maxStack || 64;
    for(let i = 0; i < 9; i++) {
        if(inventory[i].id === id && inventory[i].count < maxStack) {
            let space = maxStack - inventory[i].count;
            if(count <= space) { inventory[i].count += count; updateUI(); return true; } 
            else { inventory[i].count = maxStack; count -= space; }
        }
    }
    for(let i = 0; i < 9; i++) {
        if(inventory[i].id === 0) { inventory[i].id = id; inventory[i].count = count; updateUI(); return true; }
    }
    return false;
}

function countItem(id) { return inventory.reduce((total, slot) => slot.id === id ? total + slot.count : total, 0); }
function removeItems(id, amount) {
    let remaining = amount;
    for(let i = 8; i >= 0; i--) {
        if(inventory[i].id === id) {
            if(inventory[i].count > remaining) { inventory[i].count -= remaining; return; } 
            else { remaining -= inventory[i].count; inventory[i].id = 0; inventory[i].count = 0; }
        }
    }
}
function canCraft(recipe) { return recipe.reqs.every(req => countItem(req.id) >= req.count); }
function craft(index) {
    let recipe = recipes[index];
    if(canCraft(recipe)) {
        recipe.reqs.forEach(req => removeItems(req.id, req.count));
        addItem(recipe.result.id, recipe.result.count);
        updateCraftingMenu(); updateUI();
    }
}

function toggleCrafting() {
    isCraftingOpen = !isCraftingOpen;
    document.getElementById("crafting-menu").style.display = isCraftingOpen ? "block" : "none";
    if(isCraftingOpen) updateCraftingMenu();
}

function updateCraftingMenu() {
    const container = document.getElementById("recipes-container");
    container.innerHTML = "";
    recipes.forEach((r, index) => {
        let div = document.createElement("div"); div.className = "recipe";
        let info = document.createElement("div");
        info.innerHTML = `<strong>${r.result.count}x ${items[r.result.id].name}</strong><br><span class="recipe-reqs">Req: ` + 
            r.reqs.map(req => `${req.count} ${items[req.id].name}`).join(", ") + `</span>`;
        let btn = document.createElement("button");
        btn.className = "craft-btn"; btn.innerText = "Fabricar";
        btn.disabled = !canCraft(r); btn.onclick = () => craft(index);
        div.appendChild(info); div.appendChild(btn); container.appendChild(div);
    });
}

window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });

window.addEventListener("mousedown", e => {
    if(isCraftingOpen) return;
    
    // Check if we clicked an entity (Attack)
    if (e.button === 0) {
        let worldMouseX = mouse.x + camera.x;
        let worldMouseY = mouse.y + camera.y;
        let clickedEntity = false;

        for (let i = entities.length - 1; i >= 0; i--) {
            let ent = entities[i];
            if (worldMouseX >= ent.x && worldMouseX <= ent.x + ent.width && 
                worldMouseY >= ent.y && worldMouseY <= ent.y + ent.height) {
                
                let dist = Math.sqrt(Math.pow(worldMouseX - (player.x + player.width/2), 2) + Math.pow(worldMouseY - (player.y + player.height/2), 2));
                if (dist < 250) {
                    entities.splice(i, 1); // Kill the animal
                    clickedEntity = true;
                    break;
                }
            }
        }
        
        if (clickedEntity) return; // Prevent mining if we hit an animal
        mouse.isDown = true; 
    }

    if (e.button === 2) { // Poner Bloque
        let worldX = Math.floor((mouse.x + camera.x) / TILE);
        let worldY = Math.floor((mouse.y + camera.y) / TILE);
        let dist = Math.sqrt(Math.pow(worldX*TILE - player.x, 2) + Math.pow(worldY*TILE - player.y, 2));
        let heldItem = inventory[selectedSlot].id;

        if (worldY >= 0 && worldY < WORLD_HEIGHT && worldX >= 0 && worldX < WORLD_WIDTH && dist < 250) {
            if (world[worldY][worldX] === 0 && heldItem !== 0 && items[heldItem].isBlock) {
                let col = getCollisions(player.x, player.y, player.width, player.height);
                if (col.length === 0 || (Math.floor(player.x/TILE) !== worldX || Math.floor(player.y/TILE) !== worldY)) {
                    world[worldY][worldX] = heldItem;
                    inventory[selectedSlot].count--;
                    if(inventory[selectedSlot].count <= 0) inventory[selectedSlot].id = 0;
                    updateUI();
                }
            }
        }
    }
});

window.addEventListener("mouseup", e => { if (e.button === 0) mouse.isDown = false; });

document.addEventListener("keydown", e => {
    let key = e.key.toLowerCase();
    keys[key] = true;
    if (key >= "1" && key <= "9") { selectedSlot = parseInt(key) - 1; updateUI(); }
    if (key === "e") toggleCrafting();
    if (key === "g") { localStorage.setItem("minroger_v3", JSON.stringify({ world, inventory, entities, px: player.x, py: player.y })); alert("Guardado"); }
    if (key === "c") {
        let save = localStorage.getItem("minroger_v3");
        if (save) { let data = JSON.parse(save); world = data.world; inventory = data.inventory; entities = data.entities || []; player.x = data.px; player.y = data.py; updateUI(); alert("Cargado"); }
    }
});
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
canvas.addEventListener("contextmenu", e => e.preventDefault());

function drawBackground() {
    let bgX = (camera.x * 0.2) % canvas.width;
    ctx.drawImage(images.cielo, -bgX, 0, canvas.width, canvas.height);
    ctx.drawImage(images.cielo, canvas.width - bgX, 0, canvas.width, canvas.height);
}

function drawWorld() {
    let startX = Math.max(0, Math.floor(camera.x / TILE)), endX = Math.min(WORLD_WIDTH, Math.floor((camera.x + canvas.width) / TILE) + 1);
    let startY = Math.max(0, Math.floor(camera.y / TILE)), endY = Math.min(WORLD_HEIGHT, Math.floor((camera.y + canvas.height) / TILE) + 1);

    for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
            let blockId = world[y][x];
            if (blockId !== 0) {
                let drawX = x * TILE - camera.x;
                let drawY = y * TILE - camera.y;
                ctx.drawImage(images[items[blockId].key], drawX, drawY, TILE, TILE);
                
                if (mining.active && mining.x === x && mining.y === y) {
                    let darkIntensity = (mining.progress / mining.required) * 0.7; 
                    ctx.fillStyle = `rgba(0, 0, 0, ${darkIntensity})`;
                    ctx.fillRect(drawX, drawY, TILE, TILE);
                }
            }
        }
    }
}

function drawEntities() {
    entities.forEach(e => {
        let drawX = e.x - camera.x;
        let drawY = e.y - camera.y;

        // No dibujar si están fuera de la pantalla
        if (drawX + e.width < 0 || drawX > canvas.width || drawY + e.height < 0 || drawY > canvas.height) return;

        ctx.save();
        if (e.facingLeft) { ctx.translate(drawX + e.width, drawY); ctx.scale(-1, 1); drawX = 0; drawY = 0; }
        
        ctx.drawImage(images[e.type], drawX, drawY, e.width, e.height);
        ctx.restore();
    });
}

function drawPlayer() {
    let drawX = player.x - camera.x, drawY = player.y - camera.y;
    ctx.save();
    if (player.facingLeft) { ctx.translate(drawX + player.width, drawY); ctx.scale(-1, 1); drawX = 0; drawY = 0; }
    
    ctx.drawImage(images.jugador, drawX, drawY, player.width, player.height);
    
    let heldItem = inventory[selectedSlot].id;
    if (heldItem !== 0) {
        ctx.drawImage(images[items[heldItem].key], drawX + player.width - 15, drawY + player.height / 2 - 10, 24, 24);
    }
    ctx.restore();
}

function initUI() {
    const container = document.getElementById('ui-container');
    container.innerHTML = "";
    for (let i = 0; i < 9; i++) {
        let div = document.createElement('div'); div.className = 'hotbar-slot'; div.id = `slot-${i}`;
        if (i === selectedSlot) div.classList.add('active');
        let num = document.createElement('span'); num.className = 'hotbar-number'; num.innerText = i + 1; div.appendChild(num);
        let img = document.createElement('img'); img.id = `img-${i}`; div.appendChild(img);
        let count = document.createElement('span'); count.className = 'item-count'; count.id = `count-${i}`; div.appendChild(count);
        container.appendChild(div);
    }
    updateUI();
}

function updateUI() {
    for (let i = 0; i < 9; i++) {
        let slotDiv = document.getElementById(`slot-${i}`);
        let img = document.getElementById(`img-${i}`);
        let count = document.getElementById(`count-${i}`);
        slotDiv.className = i === selectedSlot ? 'hotbar-slot active' : 'hotbar-slot';
        
        let itemInfo = inventory[i];
        if (itemInfo.id !== 0) {
            img.src = imageSrcs[items[itemInfo.id].key];
            img.style.display = "block";
            count.innerText = itemInfo.count > 1 ? itemInfo.count : "";
        } else {
            img.style.display = "none";
            count.innerText = "";
        }
    }
}

function initGame() { generateWorld(); initUI(); gameLoop(); }

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    updatePlayer();
    updateEntities(); // Actualizar posiciones de animales
    updateMining();
    updateCamera();
    
    drawBackground();
    drawWorld();
    drawEntities(); // Dibujar animales por detrás del jugador
    drawPlayer();
    
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
